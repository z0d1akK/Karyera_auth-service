spring.application.name=auth-service
spring.config.import=optional:file:.env[.properties]

refresh-token.cleanup-cron=0 0 0 * * *

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

spring.profiles.active=${ACTIVE_PROFILE}

internal.api-key=${INTERNAL_API_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.outbox.batch-size=10
app.outbox.poll-delay-ms=2000
app.outbox.lease-seconds=180
app.outbox.send-timeout-seconds=15

app.deletion.stuck-after-seconds=300
app.deletion.reconcile-delay-ms=60000
app.deletion.reconcile-initial-delay-ms=60000
app.deletion.reconcile-batch-size=100

app.housekeeping.cron=0 0 3 * * *
app.housekeeping.outbox-retention-days=7
app.housekeeping.processed-events-retention-days=30

app.kafka.topics.user-events=auth.user.events.v1

app.kafka.topics.employee-account-events=employee.account.events.v1

spring.kafka.consumer.group-id=auth-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.java=${java.version}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.zodiakk=TRACE