databaseChangeLog:

  - changeSet:
      id: 003-add-auth-credentials-indexes
      author: zodiakk

      changes:

        - createIndex:
            tableName: auth_credentials
            indexName: idx_auth_credentials_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: auth_credentials
            indexName: idx_auth_credentials_login
            columns:
              - column:
                  name: login