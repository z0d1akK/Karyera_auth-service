databaseChangeLog:
  - changeSet:
      id: 005-add-refresh-tokens-indexes
      author: zodiakk
      changes:
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
            columns:
              - column:
                  name: expires_at

        - sql:
            dbms: postgresql
            sql: |
              CREATE INDEX idx_refresh_tokens_active_user
                  ON refresh_tokens (user_id)
                  WHERE revoked = false;