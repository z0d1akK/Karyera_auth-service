databaseChangeLog:
  - changeSet:
      id: 001-create-users
      author: zodiakk
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: false

              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: deletion_status
                  type: VARCHAR(20)
                  defaultValue: NONE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX ux_users_email_lower
                  ON users (LOWER(email));

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE users
              ADD CONSTRAINT chk_users_deletion_status
              CHECK (deletion_status IN ('NONE', 'DELETING', 'DELETED'));