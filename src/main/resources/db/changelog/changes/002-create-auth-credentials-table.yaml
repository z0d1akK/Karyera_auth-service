databaseChangeLog:
  - changeSet:
      id: 002-create-auth-credentials-table
      author: zodiakk
      changes:
        - createTable:
            tableName: auth_credentials
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: login
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: password_change_required
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: auth_credentials
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_auth_credentials_user

        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX ux_auth_credentials_login_lower
                  ON auth_credentials (LOWER(login));

        - createTable:
            tableName: administration_lock
            columns:
              - column:
                  name: id
                  type: INTEGER
                  constraints:
                    primaryKey: true
                    nullable: false

        - insert:
            tableName: administration_lock
            columns:
              - column:
                  name: id
                  valueNumeric: 1
