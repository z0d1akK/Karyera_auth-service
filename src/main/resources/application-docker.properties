server.port=${SERVER_PORT}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

integration.employee-service.url=http://${EMPLOYEE_SERVICE_HOST}:${EMPLOYEE_SERVICE_PORT}
integration.employee-service.internal-key=${INTERNAL_API_KEY}

spring.cloud.openfeign.client.config.employee-service.connectTimeout=2000
spring.cloud.openfeign.client.config.employee-service.readTimeout=3000

resilience4j.circuitbreaker.instances.employeeService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.employeeService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.employeeService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.employeeService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employeeService.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.employeeService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.employeeService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.employeeService.recordExceptions[0]=feign.RetryableException
resilience4j.circuitbreaker.instances.employeeService.recordExceptions[1]=feign.FeignException.InternalServerError
resilience4j.circuitbreaker.instances.employeeService.recordExceptions[2]=feign.FeignException.BadGateway
resilience4j.circuitbreaker.instances.employeeService.recordExceptions[3]=feign.FeignException.ServiceUnavailable
resilience4j.circuitbreaker.instances.employeeService.recordExceptions[4]=feign.FeignException.GatewayTimeout

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui