services:

  auth-service:
    image: auth-service:1.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: auth-service
    restart: unless-stopped

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${SERVER_PORT}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      EMPLOYEE_SERVICE_HOST: ${EMPLOYEE_SERVICE_HOST}
      EMPLOYEE_SERVICE_PORT: ${EMPLOYEE_SERVICE_PORT}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

    networks:
      - auth-service-network
      - employee-service-network
      - kafka-network

  postgres:
    image: postgres:17
    container_name: auth-service-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"

    command: -p ${POSTGRES_PORT}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p ${POSTGRES_PORT}" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - auth-service-network

  db-init:
    image: postgres:17
    container_name: auth-service-db-init
    restart: "no"

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      TARGET_DB: ${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ../docker/ensure-postgres-db.sh:/ensure-postgres-db.sh:ro

    entrypoint: ["/bin/sh", "/ensure-postgres-db.sh"]

    networks:
      - auth-service-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: shared-kafka
    hostname: shared-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_HOST}:${KAFKA_PORT},EXTERNAL://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENERS: CONTROLLER://${KAFKA_HOST}:${KAFKA_CONTROLLER_PORT},INTERNAL://${KAFKA_HOST}:${KAFKA_PORT},EXTERNAL://0.0.0.0:${KAFKA_HOST_PORT}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${KAFKA_HOST}:${KAFKA_CONTROLLER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_HOST_PORT}"

    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -v grep | grep kafka || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      kafka-network:
        aliases:
          - shared-kafka

volumes:
  postgres-data:
  kafka-data:

networks:
  auth-service-network:
    driver: bridge
    name: auth-service-network
  employee-service-network:
    driver: bridge
    name: employee-service-network
  kafka-network:
    driver: bridge
    name: kafka-network
